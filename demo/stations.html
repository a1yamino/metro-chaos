<!doctype html><meta charset="utf-8"><title>B7 站点动画 演示</title>
<style>body{margin:0;background:#f4f1ea}#b{position:fixed;top:8px;left:8px;display:flex;gap:6px}button{padding:8px 12px}</style>
<div id="b"><button data-s="pop">弹出</button><button data-s="crowd">拥挤</button><button data-s="deliver">送达</button></div>
<canvas id="c" width="390" height="844"></canvas>
<script type="module">
// 仅演示页：?s=pop|crowd|deliver 选场景，?at=秒 定格在该时刻（截图用），不带 at 则循环播放
import { drawBasemap } from '../src/art/basemap';
import { drawParticles, drawPopRing, stationPose, updateStationFx, burst } from '../src/art/stations';
import { LEVEL1 } from '../src/map/level1';
import { PALETTE as P } from '../src/art/palette';
import { CONFIG } from '../src/config';
const q = new URLSearchParams(location.search), at = q.has('at') ? +q.get('at') : null;
let scene = q.get('s') || 'pop';
const T = +(q.get('t') || 0); // 底图时间：?t=90 为最深夜
const ctx = document.getElementById('c').getContext('2d');
const shape = (x, y, sh, r, fill, stroke, lw = 3) => { ctx.beginPath();
  if (sh === 'circle') ctx.arc(x, y, r, 0, 7); else if (sh === 'square') ctx.rect(x - r*.85, y - r*.85, r*1.7, r*1.7);
  else { ctx.moveTo(x, y - r*1.1); ctx.lineTo(x + r, y + r*.75); ctx.lineTo(x - r, y + r*.75); ctx.closePath(); }
  if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } };
const SH = ['circle', 'triangle', 'square'], pos = [[80, 300], [300, 420], [90, 600]];
let g, t0 = 0, fired = false;
function reset() {
  const crowd = scene === 'crowd' ? [4, 7, 9] : [1, 2, 1];
  g = { t: 0, delivered: 0, lines: [], stations: pos.map(([x, y], i) => ({ id: i + 1, x, y, shape: SH[i],
    queue: Array.from({ length: crowd[i] }, (_, k) => SH[(i + k + 1) % 3]), crowdTime: crowd[i] > CONFIG.crowdLimit ? (crowd[i] - 6) * 2.5 : 0 })) };
  fired = false; updateStationFx(g, 0);
  if (scene !== 'pop') g.t = 5; // 非弹出场景：跳过弹出
}
function frame(dt) {
  g.t += dt; if (scene === 'deliver' && !fired && g.t > 5.05) { fired = true; for (const s of g.stations) burst(s.x, s.y, 14); }
  updateStationFx(g, dt);
}
function draw() {
  drawBasemap(ctx, LEVEL1, T);
  ctx.lineCap = 'round'; ctx.strokeStyle = P.lines[0]; ctx.lineWidth = 7; ctx.beginPath(); pos.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
  for (const s of g.stations) {
    const ps = stationPose(s, g.t);
    if (s.crowdTime > 0) { ctx.strokeStyle = P.danger; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(s.x, s.y, 21, -Math.PI/2, -Math.PI/2 + Math.PI*2*s.crowdTime/CONFIG.crowdFailSeconds); ctx.stroke(); }
    drawPopRing(ctx, s.x, s.y, ps.ring);
    shape(s.x + ps.dx, s.y + ps.dy, s.shape, CONFIG.stationRadius * ps.k, P.white, P.ink);
    s.queue.forEach((p, k) => shape(s.x + 18 + (k % 6) * 9, s.y - 8 + Math.floor(k / 6) * 9, p, 3.5, s.queue.length > CONFIG.crowdLimit ? P.danger : P.ink));
  }
  drawParticles(ctx);
}
reset();
if (at !== null) { const end = (scene === 'pop' ? 0 : 5) + at; while (g.t < end - 1e-6) frame(Math.min(1 / 60, end - g.t)); draw(); }
else { let last = performance.now(); const loop = now => { frame(Math.min(.05, (now - last) / 1000)); last = now; if (g.t > 7) reset(); draw(); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
document.querySelectorAll('button').forEach(b => b.onclick = () => { scene = b.dataset.s; reset(); });
</script>
